version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: costack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: costack_password123
      POSTGRES_DB: costack
    ports:
      - "5433:5432"
    volumes:
      - costack_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  costack_data:
